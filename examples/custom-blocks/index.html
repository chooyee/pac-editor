<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacEditor — custom blocks</title>
  <meta name="description" content="How to add your own blocks to PacEditor, including rich text, array and custom fields, using an ES module import.">
  <link rel="canonical" href="https://chooyee.github.io/pac-editor/examples/custom-blocks/">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pac-editor@0.1/dist/pac-editor.min.css">
  <style>
    html, body { margin: 0; height: 100%; }
    #editor { height: 100%; }

    /* Styles for the custom blocks below. Scope them under .fp-site like the built-in blocks. */
    .fp-site .x-quote { margin: 16px 32px; padding: 8px 0 8px 18px; border-left: 4px solid var(--fp-accent); }
    .fp-site .x-quote p { margin: 0 0 6px; font-size: 19px; line-height: 1.4; }
    .fp-site .x-quote cite { color: var(--fp-paper-muted); font-style: normal; font-size: 14px; }
    .fp-site .x-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; padding: 16px 32px; }
    .fp-site .x-stat { border: 1px solid var(--fp-line); border-radius: 8px; padding: 14px; }
    .fp-site .x-stat b { display: block; font-size: 28px; letter-spacing: -0.02em; }
    .fp-site .x-stat span { color: var(--fp-paper-muted); font-size: 13px; }
    .fp-site .x-stars { padding: 8px 32px; font-size: 22px; letter-spacing: 2px; color: var(--fp-accent); }
  </style>
</head>
<body>
  <div id="editor"></div>

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <!-- ES module build. Opening this over file:// is blocked by browsers; run `npm run dev` and use http://localhost:8000/examples/custom-blocks/ -->
  <script type="module">
    import { createEditor, extendConfig, esc, safeUrl, renderRich } from 'https://cdn.jsdelivr.net/npm/pac-editor@0.1/dist/pac-editor.esm.js';

    // A block is { label, icon?, fields, defaultProps, render(props, { slot, edit }) }.
    // render returns an HTML string: wrap every user value in esc(), every URL in safeUrl().
    const Quote = {
      label: 'Quote',
      icon: '<path d="M10 7H6v5h4v1a3 3 0 0 1-3 3M19 7h-4v5h4v1a3 3 0 0 1-3 3"/>',
      fields: {
        text: { type: 'richtext', label: 'Quote' },
        by: { type: 'text', label: 'Who said it' },
        link: { type: 'text', label: 'Source link (optional)' }
      },
      defaultProps: { text: 'A short, memorable sentence.', by: 'A happy customer', link: '' },
      render: p => `<blockquote class="x-quote">${renderRich(p.text)}<cite>${p.link ? `<a href="${esc(safeUrl(p.link))}">${esc(p.by)}</a>` : esc(p.by)}</cite></blockquote>`
    };

    // Array fields edit a list of items.
    const Stats = {
      label: 'Stats',
      icon: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
      fields: {
        items: {
          type: 'array', label: 'Numbers',
          arrayFields: { value: { type: 'text', label: 'Number' }, label: { type: 'text', label: 'Label' } },
          defaultItemProps: { value: '0', label: 'Label' },
          getItemSummary: item => item.label,
          max: 6
        }
      },
      defaultProps: { items: [{ value: '24/7', label: 'Support' }, { value: '98%', label: 'Claims paid' }, { value: '3 min', label: 'Average wait' }] },
      render: p => `<div class="x-stats">${(p.items || []).map(i => `<div class="x-stat"><b>${esc(i.value)}</b><span>${esc(i.label)}</span></div>`).join('')}</div>`
    };

    // A custom field: render() returns any element; call onChange(value) to update the block.
    const starField = {
      type: 'custom', label: 'Rating',
      render: ({ id, value, onChange }) => {
        const input = document.createElement('input');
        input.type = 'range'; input.id = id; input.min = 1; input.max = 5; input.value = value ?? 5;
        input.addEventListener('input', () => onChange(Number(input.value)));
        return input;
      }
    };
    const Rating = {
      label: 'Rating',
      icon: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
      fields: { stars: starField },
      defaultProps: { stars: 4 },
      render: p => { const n = Math.min(5, Math.max(1, Math.round(+p.stars || 1))); return `<div class="x-stars" role="img" aria-label="${n} out of 5 stars">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</div>`; }
    };

    // Start from the built-in blocks, add three and drop one.
    const config = extendConfig({
      components: { Quote, Stats, Rating, Spacer: null },
      categories: { Highlights: ['Quote', 'Stats', 'Rating'] }
    });

    createEditor('#editor', {
      config,
      title: 'Custom blocks',
      data: {
        root: { props: { title: 'Custom blocks', footer: '' } },
        content: [
          { type: 'Heading', props: { id: 'Heading-1', text: 'Why members stay with us', level: 'h2', align: 'left' } },
          { type: 'Stats', props: { id: 'Stats-1', ...Stats.defaultProps } },
          { type: 'Quote', props: { id: 'Quote-1', text: 'They answered on the first ring.', by: 'Member since 2019', link: '' } },
          { type: 'Rating', props: { id: 'Rating-1', stars: 5 } }
        ]
      }
    });
  </script>
</body>
</html>
