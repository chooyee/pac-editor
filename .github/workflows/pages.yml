name: Pages

# Publishes the examples to GitHub Pages: https://chooyee.github.io/pac-editor/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node examples/server-render/render.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          # Landing page, sitemap.xml, llms.txt (and any search-engine verification file)
          cp -r site/. _site/
          # The example pages load PacEditor from jsDelivr, so dist/ is not published
          cp -r examples _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
